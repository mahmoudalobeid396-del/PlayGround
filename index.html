<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pixel Isles</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">◆</span><span>PIXEL ISLES</span></div>
      <div class="stats">
        <div class="stat"><span class="stat-icon gem">●</span><b id="crystals">0</b></div>
        <div class="stat"><span class="stat-icon coin">●</span><b id="coins">0</b></div>
        <button id="soundBtn" class="icon-btn" aria-label="Toggle sound">♪</button>
        <button id="resetBtn" class="icon-btn" aria-label="Reset game">↻</button>
      </div>
    </header>

    <section class="stage">
      <div class="island-wrap">
        <div id="island" class="island" aria-label="6 by 6 game board"></div>
      </div>

      <aside class="mission-card">
        <div class="mission-head">
          <span>QUEST</span>
          <span id="levelLabel">1 / 3</span>
        </div>
        <h2 id="questTitle">Crystal Trail</h2>
        <p id="questText">Collect every crystal</p>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </aside>

      <button id="centerBtn" class="center-btn" aria-label="Center view">⌖</button>
    </section>

    <nav class="bottombar" aria-label="Move controls">
      <button class="move-btn" data-dir="up" aria-label="Move up">▲</button>
      <button class="move-btn" data-dir="left" aria-label="Move left">◀</button>
      <button class="move-btn" data-dir="down" aria-label="Move down">▼</button>
      <button class="move-btn" data-dir="right" aria-label="Move right">▶</button>
    </nav>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="game.js"></script>
</body>
</html>
